<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Lightning AI brings intelligent answers, study tools, mock interview practice, and speech transcription together. Explore Lightning Plus or the separate trainable model."
    />
    <title>Lightning AI — Your AI study and interview partner</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%237dd3fc' d='M37 3 10 36h18l-3 25 29-39H35z'/%3E%3C/svg%3E"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              serif: ["Iowan Old Style", "Baskerville", "serif"],
            },
            keyframes: {
              marquee: {
                from: { transform: "translateX(0)" },
                to: { transform: "translateX(-50%)" },
              },
            },
            animation: {
              marquee: "marquee 36s linear infinite",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        scroll-behavior: smooth;
        background: #000;
        scroll-padding-top: 88px;
      }

      body {
        min-width: 0;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: "DM Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: rgba(255, 255, 255, 0.24);
      }

      .hero-video {
        object-position: center 46%;
      }

      .video-mockup {
        isolation: isolate;
      }

      .video-mockup::after {
        position: absolute;
        z-index: -1;
        inset: 0;
        background: rgba(0, 0, 0, 0.38);
        content: "";
      }

      .marquee-mask {
        mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
      }

      .marquee-track:hover {
        animation-play-state: paused;
      }

      .wave-bar {
        width: 3px;
        flex: 0 0 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
      }

      .faq-answer {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 300ms ease;
      }

      .faq-answer[data-open="true"] {
        grid-template-rows: 1fr;
      }

      .faq-answer > div {
        overflow: hidden;
      }

      .faq-plus {
        transition: transform 300ms ease;
      }

      .faq-plus[data-open="true"] {
        transform: rotate(45deg);
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react">
      const { useEffect, useRef, useState } = React;

      const HERO_VIDEO =
        "https://cdn.sceneai.art/Hero%20Section%20Video/50b4f304-cdca-4e12-8735-580d225834be.mp4";

      function LogoMark({ className = "h-8 w-8" }) {
        const [logoUnavailable, setLogoUnavailable] = useState(false);

        if (logoUnavailable) {
          return (
            <svg
              className={`logo-mark ${className}`}
              viewBox="0 0 64 64"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M37 3 10 36h18l-3 25 29-39H35z"
                fill="#7dd3fc"
                stroke="white"
                strokeOpacity=".75"
                strokeWidth="2"
                strokeLinejoin="round"
              />
            </svg>
          );
        }

        return (
          <img
            className={`logo-mark ${className}`}
            src="./logo-to-svg-converter.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
            onError={() => setLogoUnavailable(true)}
          />
        );
      }

      function BrandName() {
        return (
          <span
            aria-label="Lightning"
            className="text-xl font-bold leading-none tracking-[-0.055em]"
          >
            lightning
          </span>
        );
      }

      function Icon({ name, className = "h-5 w-5" }) {
        const shared = {
          className,
          fill: "none",
          stroke: "currentColor",
          strokeLinecap: "round",
          strokeLinejoin: "round",
          strokeWidth: 1.7,
          viewBox: "0 0 24 24",
          "aria-hidden": true,
        };
        const paths = {
          arrow: <><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></>,
          menu: <><path d="M4 7h16" /><path d="M4 17h16" /></>,
          close: <><path d="m6 6 12 12" /><path d="M18 6 6 18" /></>,
          mic: <><rect x="9" y="3" width="6" height="12" rx="3" /><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-4 0h8" /></>,
          sound: <><path d="M2 10v4m4-8v12m4-16v20m4-14v8m4-11v14m4-9v4" /></>,
          play: <><path d="m9 6 10 6-10 6V6Z" fill="currentColor" stroke="none" /></>,
        };
        return <svg {...shared}>{paths[name]}</svg>;
      }

      function FadeInUp({ children, className = "", delay = 0 }) {
        const element = useRef(null);
        const [visible, setVisible] = useState(false);

        useEffect(() => {
          if (!element.current) return undefined;

          if (!("IntersectionObserver" in window)) {
            setVisible(true);
            return undefined;
          }

          const observer = new IntersectionObserver(
            ([entry]) => {
              if (!entry.isIntersecting) return;
              setVisible(true);
              observer.disconnect();
            },
            { threshold: 0.12 }
          );
          observer.observe(element.current);
          return () => observer.disconnect();
        }, []);

        return (
          <div
            ref={element}
            className={`transform transition-all duration-1000 ease-out ${
              visible ? "translate-y-0 opacity-100" : "translate-y-10 opacity-0"
            } ${className}`}
            style={{ transitionDelay: `${delay}ms` }}
          >
            {children}
          </div>
        );
      }

      function DesktopDownloads() {
        const builds = [
          {
            name: "Windows",
            href: "./downloads/LightningAssistant-Windows-Portable.zip",
            download: "LightningAssistant-Windows-Portable.zip",
            checksum: "7ad3dd6556beea865b8b54e1a7db264e30bc79bc0061ba69adab84bc396e075e",
            detail: "ZIP · Extract, then run LightningAssistant.exe",
            icon: (
              <svg aria-hidden="true" className="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 4.2 10.4 3v8H3V4.2Zm8.5-1.35L21 1.5V11h-9.5V2.85ZM3 12.2h7.4v8L3 19V12.2Zm8.5 0H21v9.5l-9.5-1.35V12.2Z" />
              </svg>
            ),
          },
          {
            name: "macOS",
            href: "./downloads/LightningAssistant-macOS-Portable.zip",
            download: "LightningAssistant-macOS-Portable.zip",
            checksum: "2167683889bab23dd4669545a94d2ccbe38da776bdc19ff33449d93748c6a50f",
            detail: "ZIP · Unsigned portable build",
            icon: (
              <svg aria-hidden="true" className="h-5 w-5" fill="none" viewBox="0 0 24 24">
                <path d="M12 7c1.3-1.5 2.8-2.2 4.2-2.2 2 0 3.8 1.4 4.7 3.4-2.5 1.4-3 5.2-.5 7.1-.7 2-1.8 4.1-3.5 4.1-1 0-1.7-.7-3-.7s-2 .7-3 .7c-2.3 0-5.3-5.5-5.3-9.4 0-3.1 2-5.2 4.4-5.2 1 0 2 .4 2.6.9Z" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" />
                <path d="M13.5 4.4c.2-1.5 1.2-2.8 2.7-3.4.2 1.7-.8 3.1-2.7 3.4Z" fill="currentColor" />
              </svg>
            ),
          },
        ];

        return (
          <div className="mx-auto mt-20 w-full max-w-2xl">
            <p className="text-center text-sm font-medium text-gray-300">
              Get Lightning AI for desktop
            </p>
            <p className="mt-2 text-center text-sm text-gray-500">
              Download a portable build for your computer.
            </p>
            <div className="mt-6 flex flex-wrap justify-center gap-3">
              {builds.map((build) => (
                <a
                  className="inline-flex min-h-12 items-center gap-3 rounded-xl border border-white/10 bg-white/5 px-5 text-left text-sm text-gray-300 transition-colors hover:border-white/25 hover:bg-white/10 hover:text-white"
                  download={build.download}
                  href={build.href}
                  key={build.name}
                >
                  {build.icon}
                  <span>
                    <span className="block">Download for {build.name}</span>
                    <span className="mt-1 block text-xs text-gray-500">{build.detail}</span>
                  </span>
                </a>
              ))}
            </div>
            <p className="mt-5 text-center text-xs leading-5 text-amber-200/80">
              These builds are not code-signed. Windows SmartScreen or macOS security
              may warn about them. Only run software from a source you trust.
            </p>
            <details className="mx-auto mt-4 max-w-xl text-xs text-gray-500">
              <summary className="cursor-pointer text-center hover:text-gray-300">
                Verify download checksums (SHA-256)
              </summary>
              <dl className="mt-3 space-y-3 break-all rounded-xl border border-white/10 bg-white/[0.025] p-4">
                {builds.map((build) => (
                  <div key={build.name}>
                    <dt className="font-medium text-gray-300">{build.name}</dt>
                    <dd className="mt-1 font-mono">{build.checksum}</dd>
                  </div>
                ))}
              </dl>
            </details>
          </div>
        );
      }

      function ActionLink({ children, href = "#contact", secondary = false }) {
        return (
          <a
            className={`inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-sm font-medium transition-colors ${
              secondary
                ? "border border-white/5 bg-[#1F1F22] text-white hover:bg-[#2A2A2D]"
                : "bg-white text-black hover:bg-gray-200"
            }`}
            href={href}
          >
            {children}
            <Icon name="arrow" className="h-4 w-4" />
          </a>
        );
      }

      function Navigation() {
        const [scrolled, setScrolled] = useState(false);
        const [menuOpen, setMenuOpen] = useState(false);
        const links = [
          ["About", "#about"],
          ["Features", "#features"],
          ["Pricing", "#pricing"],
          ["FAQ", "#faq"],
          ["Contact", "#contact"],
        ];

        useEffect(() => {
          const handleScroll = () => setScrolled(window.scrollY > 20);
          handleScroll();
          window.addEventListener("scroll", handleScroll, { passive: true });
          return () => window.removeEventListener("scroll", handleScroll);
        }, []);

        function closeMenu() {
          setMenuOpen(false);
        }

        return (
          <nav
            aria-label="Main navigation"
            className={`fixed inset-x-0 top-0 z-50 transition-colors duration-300 ${
              scrolled ? "bg-black/80 backdrop-blur-md" : "bg-transparent"
            }`}
          >
            <div className="mx-auto flex h-[76px] max-w-7xl items-center justify-between px-6">
              <a
                aria-label="Lightning home"
                className="flex items-center gap-1 text-white"
                href="#about"
                onClick={closeMenu}
              >
                <LogoMark />
                <BrandName />
              </a>
              <div className="hidden items-center gap-9 md:flex">
                {links.map(([label, href]) => (
                  <a
                    key={label}
                    className="text-sm font-medium text-gray-300 transition-colors hover:text-white"
                    href={href}
                  >
                    {label}
                  </a>
                ))}
              </div>
              <div className="hidden md:block">
                <ActionLink href="#pricing" secondary>
                  Get started
                </ActionLink>
              </div>
              <button
                aria-expanded={menuOpen}
                aria-label={menuOpen ? "Close menu" : "Open menu"}
                className="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/10 bg-white/5 text-white md:hidden"
                onClick={() => setMenuOpen((open) => !open)}
                type="button"
              >
                <Icon name={menuOpen ? "close" : "menu"} />
              </button>
            </div>
            <div
              className={`grid overflow-hidden border-white/10 bg-black/95 px-6 transition-all duration-300 md:hidden ${
                menuOpen
                  ? "max-h-80 border-t py-3 opacity-100"
                  : "max-h-0 border-t-0 py-0 opacity-0"
              }`}
            >
              {links.map(([label, href]) => (
                <a
                  key={label}
                  className="py-3 text-sm font-medium text-gray-300 transition-colors hover:text-white"
                  href={href}
                  onClick={closeMenu}
                  tabIndex={menuOpen ? 0 : -1}
                >
                  {label}
                </a>
              ))}
              <a
                className="mt-2 inline-flex min-h-11 items-center justify-center rounded-full bg-white px-5 text-sm font-medium text-black"
                href="#pricing"
                onClick={closeMenu}
                tabIndex={menuOpen ? 0 : -1}
              >
                Get started
              </a>
            </div>
          </nav>
        );
      }

      function Hero() {
        return (
          <section
            className="relative z-0 flex min-h-screen flex-col items-center justify-center overflow-hidden px-6 pb-20 pt-32"
            id="about"
          >
            <video
              aria-hidden="true"
              autoPlay
              className="hero-video absolute inset-0 -z-10 min-h-full min-w-full object-cover opacity-90"
              loop
              muted
              playsInline
              src={HERO_VIDEO}
            />
            <div
              aria-hidden="true"
              className="absolute inset-0 -z-10 bg-gradient-to-b from-black/30 via-black/15 to-black"
            />
            <div className="relative mx-auto flex w-full max-w-5xl flex-col items-center text-center">
              <FadeInUp>
                <span className="mb-8 inline-flex items-center rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-gray-300 backdrop-blur-sm">
                  <span aria-hidden="true" className="mr-2">✨</span>
                  Announcing Lightning API 2.0 &amp; Stealth 2.0
                </span>
              </FadeInUp>
              <FadeInUp delay={100}>
                <h1 className="mb-6 text-center text-5xl font-medium tracking-tight text-white md:text-7xl">
                  The intelligence layer
                  <br className="hidden sm:block" /> for the{" "}
                  <span className="font-serif font-normal italic">interview.</span>
                </h1>
              </FadeInUp>
              <FadeInUp delay={180}>
                <p className="max-w-2xl text-center text-[16px] leading-7 text-gray-400">
                  Meet Lightning AI: an AI chat assistant for clear answers,
                  learning, and mock interview practice, plus speech
                  transcription and a separate model you can train with your
                  own data.
                </p>
              </FadeInUp>
              <FadeInUp className="mt-8 flex flex-wrap items-center justify-center gap-3" delay={260}>
                <ActionLink href="#pricing">Get started</ActionLink>
                <ActionLink href="#features" secondary>Learn more</ActionLink>
              </FadeInUp>
            </div>
            <FadeInUp className="w-full max-w-5xl" delay={350}>
              <DesktopDownloads />
            </FadeInUp>
          </section>
        );
      }

      function ChatMockup() {
        return (
          <div className="video-mockup relative flex min-h-[410px] items-center justify-center overflow-hidden rounded-3xl border border-white/10 p-5 sm:p-8">
            <video
              aria-hidden="true"
              autoPlay
              className="absolute inset-0 -z-10 h-full w-full object-cover"
              loop
              muted
              playsInline
              src="https://cdn.sceneai.art/Hero%20Section%20Video/1bcc8fa3-37f6-4c53-8591-0347e4c7f8ac.mp4"
            />
            <div className="relative w-full max-w-md rounded-2xl border border-white/10 bg-[#1C1C1E]/90 p-4 shadow-2xl backdrop-blur-xl sm:p-5">
              <div className="mb-5 flex flex-wrap gap-2">
                {["Create image", "Write", "Analyze"].map((item) => (
                  <span
                    key={item}
                    className="rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs text-gray-300"
                  >
                    {item}
                  </span>
                ))}
              </div>
              <div className="mb-5 min-h-32 rounded-xl border border-white/5 bg-black/30 p-4">
                <p className="mb-2 text-xs text-gray-500">Lightning AI Assistant</p>
                <p className="text-sm leading-6 text-gray-200">
                  What can I help you understand today?
                </p>
              </div>
              <div className="flex items-center gap-3 rounded-xl border border-white/10 bg-black/40 px-4 py-3">
                <span className="flex-1 text-sm text-gray-500">Ask anything...</span>
                <button aria-label="Voice input" className="text-gray-400" type="button">
                  <Icon name="mic" className="h-4 w-4" />
                </button>
                <button aria-label="Send message" className="text-white" type="button">
                  <Icon name="sound" className="h-4 w-4" />
                </button>
              </div>
            </div>
          </div>
        );
      }

      function Waveform() {
        const heights = [
          11, 19, 13, 26, 17, 31, 16, 23, 12, 28, 18, 35, 20, 12, 26, 15, 32, 19,
          11, 24, 16, 29, 13, 22, 34, 17, 12, 27, 15, 20, 31, 13, 25, 17,
        ];
        return (
          <div aria-label="Audio waveform" className="flex h-10 items-center justify-between gap-[3px]" role="img">
            {heights.map((height, index) => (
              <span
                className="wave-bar"
                key={`${index}-${height}`}
                style={{ height: `${height}px`, opacity: index < 17 ? 0.95 : 0.48 }}
              />
            ))}
          </div>
        );
      }

      function TranscriptionMockup() {
        return (
          <div className="video-mockup relative flex min-h-[410px] items-center justify-center overflow-hidden rounded-3xl border border-white/10 p-5 sm:p-8">
            <video
              aria-hidden="true"
              autoPlay
              className="absolute inset-0 -z-10 h-full w-full object-cover"
              loop
              muted
              playsInline
              src="https://cdn.sceneai.art/Hero%20Section%20Video/736fd4a0-70ac-4f44-9633-55769ead6aca.mp4"
            />
            <div className="w-full max-w-md rounded-2xl border border-white/10 bg-[#1C1C1E]/90 p-5 shadow-2xl backdrop-blur-xl">
              <div className="mb-5 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <button
                    aria-label="Play recording"
                    className="flex h-10 w-10 items-center justify-center rounded-full bg-white text-black"
                    type="button"
                  >
                    <Icon name="play" className="h-4 w-4" />
                  </button>
                  <div>
                    <p className="text-sm font-medium text-white">11:06 AM – Chris</p>
                    <p className="mt-1 text-xs text-gray-500">Voice note · 00:42</p>
                  </div>
                </div>
                <span className="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-2.5 py-1 text-[11px] text-emerald-300">
                  Transcribed
                </span>
              </div>
              <Waveform />
              <div className="my-5 h-px bg-white/10" />
              <p className="mb-3 text-xs font-medium uppercase tracking-[0.16em] text-gray-500">
                Transcription
              </p>
              <p className="text-sm leading-6 text-gray-300">
                “Let’s review the project timeline and make sure we’re aligned
                on the next steps before Friday.”
              </p>
              <button className="mt-4 text-xs text-gray-400 transition-colors hover:text-white" type="button">
                Copy transcript
              </button>
            </div>
          </div>
        );
      }

      function LiveCopilotMockup() {
        return (
          <div className="video-mockup relative flex min-h-[410px] items-center justify-center overflow-hidden rounded-3xl border border-white/10 p-5 sm:p-8">
            <video
              aria-hidden="true"
              autoPlay
              className="absolute inset-0 -z-10 h-full w-full object-cover"
              loop
              muted
              playsInline
              src={HERO_VIDEO}
            />
            <div className="w-full max-w-md rounded-2xl border border-white/10 bg-[#1C1C1E]/90 p-5 shadow-2xl backdrop-blur-xl">
              <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p className="text-sm font-medium text-white">Lightning AI Copilot</p>
                  <p className="mt-1 text-xs text-gray-500">Your trained study assistant</p>
                </div>
                <span className="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-2.5 py-1 text-[11px] text-emerald-300">
                  Visible assistance
                </span>
              </div>
              <div className="mb-4 flex flex-wrap gap-2">
                {["Zoom", "Microsoft Teams", "Your training data"].map((item) => (
                  <span
                    className="rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs text-gray-300"
                    key={item}
                  >
                    {item}
                  </span>
                ))}
              </div>
              <div className="rounded-xl border border-white/10 bg-black/35 p-4">
                <p className="mb-2 text-xs font-medium uppercase tracking-[0.16em] text-gray-500">
                  From your study materials
                </p>
                <p className="text-sm leading-6 text-gray-200">
                  Your notes highlight three key points. Use them to guide your
                  explanation, then add an example in your own words.
                </p>
              </div>
              <p className="mt-4 text-xs leading-5 text-gray-500">
                For meetings and presentations where AI assistance is permitted
                and disclosed.
              </p>
            </div>
          </div>
        );
      }

      function FeatureCopy({ badge, color, title, description }) {
        return (
          <div className="flex flex-col items-start justify-center">
            <span className={`mb-5 text-sm font-medium ${color}`}>
              <span aria-hidden="true" className="mr-2">✨</span>
              {badge}
            </span>
            <h2 className="max-w-xl text-4xl font-semibold leading-[1.12] tracking-tight text-white md:text-5xl">
              {title}
            </h2>
            <p className="mt-5 max-w-lg text-base leading-7 text-gray-400">
              {description}
            </p>
            <div className="mt-8">
              <ActionLink href="#pricing">Get started</ActionLink>
            </div>
          </div>
        );
      }

      function Features() {
        return (
          <>
            <section className="mx-auto grid max-w-7xl grid-cols-1 gap-12 px-6 py-24 lg:grid-cols-2 lg:gap-16" id="features">

                <p className="px-6 pb-6 text-sm leading-6 text-gray-400">{answer}</p>
              </div>
            </div>
          </div>
        );
      }

      function FAQ() {
        const [openIndex, setOpenIndex] = useState(null);
        return (
          <section className="mx-auto max-w-3xl px-6 py-32" id="faq">
            <FadeInUp>
              <h2 className="mb-12 text-center text-4xl font-semibold tracking-tight text-white md:text-5xl">
                We&apos;ve got answers
              </h2>
              <div className="rounded-xl border border-white/10 bg-transparent">
                {questions.map(({ question, answer }, index) => (
                  <FAQItem
                    answer={answer}
                    index={index}
                    key={question}
                    onToggle={() =>
                      setOpenIndex((current) => (current === index ? null : index))
                    }
                    open={openIndex === index}
                    question={question}
                  />
                ))}
              </div>
            </FadeInUp>
          </section>
        );
      }

      function Footer() {
        const columns = [
          {
            title: "Product",
            links: [
              ["About", "#about"],
              ["Pricing", "#pricing"],
              ["Changelog", "#features"],

          {
            title: "Legal",
            links: [
              ["Terms of service", "#contact"],
              ["Privacy policy", "#contact"],
              ["404", "#contact"],

          },
          {
            title: "Connect",

              ["Instagram", "https://www.instagram.com/"],
              ["YouTube", "https://www.youtube.com/"],
              ["LinkedIn", "https://www.linkedin.com/"],
              ["Twitter / X", "https://x.com/"],
            ],
          },

        return (

            <video
              aria-hidden="true"
              autoPlay
              className="absolute inset-0 -z-10 h-full w-full object-cover opacity-40"
              loop
              muted
              playsInline
              src={HERO_VIDEO}
            />
            <div
              aria-hidden="true"
              className="absolute inset-0 -z-10 bg-gradient-to-b from-black via-black/80 to-black"
            />
            <FadeInUp className="mx-auto mb-32 max-w-4xl text-center">
              <h2 className="text-4xl font-medium tracking-tight text-white md:text-6xl">
                Ready to learn with
                <br className="hidden sm:block" />{" "}
                <span className="font-serif italic">Lightning AI?</span>
              </h2>
              <div className="mt-8 flex flex-wrap items-center justify-center gap-3">
                <ActionLink href="#pricing">Get started</ActionLink>
                <ActionLink href="#about" secondary>Learn more</ActionLink>
              </div>
            </FadeInUp>
            <div className="mx-auto mb-24 grid max-w-7xl grid-cols-1 gap-10 md:grid-cols-4 md:gap-8">
              <div>
                <a className="inline-flex items-center gap-1 text-white" href="#about">
                  <LogoMark />
                  <BrandName />
                </a>
                <p className="mt-4 max-w-xs text-sm text-gray-400">
                  AI-powered study, mock interview practice, transcription, and a model you can train with your own data.

              </div>
              {columns.map((column) => (

                    {column.links.map(([label, href]) => (
                      <li key={label}>
                        <a

                          target={href.startsWith("https://") ? "_blank" : undefined}

                          {label}
                        </a>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
            <div className="mx-auto flex max-w-7xl flex-col items-center justify-center gap-4 border-t border-white/5 pt-8 text-center text-xs text-gray-500 md:flex-row">

              <span aria-hidden="true" className="hidden text-gray-700 md:inline">·</span>
              <span>Learn. Practise. Build.</span>

              <a className="text-gray-400 transition-colors hover:text-white" href="#pricing">Explore plans</a>
            </div>

        );
      }

      function App() {
        return (
          <>
            <Navigation />
            <main>
              <Hero />
              <Features />
              <Pricing />
              <FAQ />
            </main>
            <Footer />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
